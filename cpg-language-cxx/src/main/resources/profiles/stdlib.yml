# Data flow summaries of the "stdlib" profile (see StdlibProfile). The format is described in
# docs/docs/CPG/specs/dfg-function-summaries.md. The language CLanguage also covers CPPLanguage.

- functionDeclaration:
    language: CLanguage
    methodName: memcpy
  dataFlows:
    - from: param1.deref
      to: param0.deref
      dfgType: full
    - from: param0.deref
      to: return
      dfgType: full

- functionDeclaration:
    language: CLanguage
