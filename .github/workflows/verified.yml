# Builds the Lean project in cpg-verified, which checks all proofs, runs its tests and makes sure
# that the main theorems only depend on Lean's standard axioms. Afterward, the verified translation is
# run on the Go frontend's test files and compared with the output of the Go frontend.
name: verified

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cpg-verified/**"
      - "cpg-language-go/**"
      - ".github/workflows/verified.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "cpg-verified/**"
      - "cpg-language-go/**"
      - ".github/workflows/verified.yml"

permissions:
  contents: read

jobs:
  lean:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: cpg-verified
          use-mathlib-cache: false
      - name: Check axioms
        working-directory: cpg-verified
        run: |
          lake env lean Axioms.lean | tee axioms.txt
          if grep -E "sorryAx|ofReduceBool" axioms.txt; then
            echo "::error::A main theorem depends on sorry or native_decide"
            exit 1
          fi
      - name: Debug toolchain layout
        run: |
          P="$(cd cpg-verified && lean --print-prefix)"
          ls "$P" "$P/lib" "$P/lib/lean" | head -100
          find "$P/lib" -maxdepth 2 -name "libc*" | head -20
          cat cpg-verified/.lake/build/bin/cpg-translate.rsp
      - name: Build native library
        run: cpg-verified/native/build.sh
      - uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "21"
      - name: Compare with the Go frontend
        run: |
          # Only the Go frontend is needed
          echo "enableGoFrontend=true" > gradle.properties
          ./gradlew :cpg-language-go:test --tests "*VerifiedTranslationTest*" --console=plain
      - name: Report comparison
        if: always()
        run: |
          {
            echo '```'
            sed -n '/<system-out>/,/<\/system-out>/p' \
              cpg-language-go/build/test-results/test/TEST-*VerifiedTranslationTest.xml \
              | grep -E "requests,|not found:|MISMATCH|TOTAL" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
